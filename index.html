<!DOCTYPE html>
<html >
<head>
   
    <title>Tabel</title>
</head>
<body>
    <h1>
        Format Tabel
    </h1>

    <p>Pembuatan tabel</p>
    
    <ol type="A">
        <li>Beras</li>
        <li>Minyak</li>
        <li>Gula</li>
        <li>Kudapan
            <ul type="circle">
                <li>Chitato</li>
                <li>Pocky</li>
                <li>Oreo</li>
                <li>Pringles</li>
             </ul>
        </li>
        <li>Minuman
        </li>
    </ol>

    <hr>
    <table border="1">
        <tr>
          <td>Nama</td><td>Geraldo</td>
        </tr>
        <tr>
          <td>Nrp</td><td>225170699</td>
        </tr>
        <tr>
          <td>Hobi</td> <td>Editing</td>
        </tr>
      </table>

      <hr>
      <table border="1">
    <thead>
        <tr>
          <th>No</th><th>Handphone</th></th><th>Jumlah</th>
        </tr>
    </thead>


    <tbody>
        <tr>
          <td>1</td><td>IPhone</td><td>10</td>
        </tr>
        <tr>
          <td>2</td> <td>Samsung</td><td>30</td>
        </tr>
        <tr>
            <td>3</td> <td>Xiaomi</td><td>50</td>
          </tr>

    <tfoot>
          <tr>
            <th colspan="2">Total </th><td>90</td>
          </tr>
    </tfoot>
    </tbody>
      </table>
      

</body>
</html>
